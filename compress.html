  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --border: #e2e2e2;
      --text: #0f0f0f;
      --muted: #666666;
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation */
    .top-bar {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: var(--primary);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }

    nav {
      display: flex;
      gap: 4px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    nav a:hover {
      color: var(--primary);
      background: var(--surface);
    }

    nav a.active {
      color: var(--primary);
      background: rgba(220, 38, 38, 0.06);
    }

    /* Hero Section */
    .hero {
      border-bottom: 1px solid var(--border);
      padding: 48px 24px;
      background: var(--surface);
    }

    .hero-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .hero-desc {
      color: var(--muted);
      font-size: 15px;
      max-width: 580px;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* Dropzone */
    .dropzone {
      border: 1px dashed var(--border);
      background: var(--bg);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: var(--surface);
    }

    .dropzone-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .dropzone-sub {
      font-size: 13px;
      color: var(--muted);
    }

    /* Alert Banner */
    .alert {
      padding: 12px 16px;
      border: 1px solid var(--border);
      font-size: 13px;
      margin-bottom: 24px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(220, 38, 38, 0.04);
    }

    /* Workspace */
    .workspace {
      display: none;
      margin-top: 32px;
    }

    .workspace.active {
      display: block;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .file-card {
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .file-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
    }

    .file-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: var(--primary);
    }

    /* Controls */
    .options-panel {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 24px;
      margin-bottom: 24px;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-label {
      font-size: 13px;
      font-weight: 600;
    }

    .option-desc {
      font-size: 12px;
      color: var(--muted);
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 13px;
      font-family: var(--font);
      color: var(--text);
      max-width: 300px;
      outline: none;
    }

    select:focus {
      border-color: var(--primary);
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      background: var(--bg);
    }

    .footer-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <span class="brand-badge">PDF</span>
        freepdfs.tools
      </a>
      <nav>
        <a href="merge.html">Merge</a>
        <a href="split.html">Split</a>
        <a href="compress.html" class="active">Compress</a>
        <a href="organize.html">Organize</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-container">
      <h1>Compress PDF file</h1>
      <p class="hero-desc">Compress the size of your PDF.</p>
    </div>
  </section>

  <main>
    <div id="alert" class="alert"></div>

    <div id="dropzone" class="dropzone">
      <input type="file" id="file-input" accept="application/pdf,.pdf" style="display: none;" />
      <div class="dropzone-title">Select or drop a PDF file</div>
      <div class="dropzone-sub">Upload a single file to compress size</div>
    </div>

    <div id="workspace" class="workspace">
      <div class="section-label">Selected File</div>

      <div class="file-card">
        <div class="file-details">
          <span id="file-name" class="file-name">filename.pdf</span>
          <span id="file-meta" class="file-meta">0 KB</span>
        </div>
        <button id="clear-btn" class="clear-btn">Remove file</button>
      </div>

      <div class="options-panel">
        <div class="option-group">
          <label class="option-label" for="compression-level">Compression Settings</label>
          <select id="compression-level">
            <option value="low">Low Compression</option>
            <option value="medium">Standard Compression</option>
            <option value="high">High Compression</option>
          </select>

        </div>
      </div>

      <div class="actions-bar">
        <span></span>
        <button id="compress-btn" class="btn">Compress File</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <p>&copy; freepdfs.tools</p>
      <p>
        <a href="privacy.html" style="color: var(--muted); margin-right: 12px;">Privacy Policy</a>
        <a href="terms.html" style="color: var(--muted);">Terms of Service</a>
      </p>
    </div>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.addEventListener('DOMContentLoaded', () => {
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file-input');
      const workspace = document.getElementById('workspace');
      const fileNameEl = document.getElementById('file-name');
      const fileMetaEl = document.getElementById('file-meta');
      const clearBtn = document.getElementById('clear-btn');
      const compressBtn = document.getElementById('compress-btn');
      const alert = document.getElementById('alert');
      const compressionLevel = document.getElementById('compression-level');

      let selectedFile = null;
      let rawArrayBuffer = null;

      dropzone.addEventListener('click', () => fileInput.click());
      clearBtn.addEventListener('click', reset);

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFile(e.target.files[0]);
        }
        fileInput.value = '';
      });

      ['dragenter', 'dragover'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
        });
      });

      dropzone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      async function handleFile(file) {
        hideAlert();
        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
          showAlert('Please select a valid PDF file.');
          return;
        }

        selectedFile = file;
        rawArrayBuffer = await file.arrayBuffer();

        fileNameEl.textContent = file.name;
        fileMetaEl.textContent = `${(file.size / 1024).toFixed(1)} KB`;

        dropzone.style.display = 'none';
        workspace.classList.add('active');
      }

      function reset() {
        selectedFile = null;
        rawArrayBuffer = null;
        workspace.classList.remove('active');
        dropzone.style.display = 'block';
        hideAlert();
      }

      function showAlert(msg) {
        alert.textContent = msg;
        alert.className = 'alert error show';
      }

      function hideAlert() {
        alert.className = 'alert';
      }

      compressBtn.addEventListener('click', async () => {
        if (!rawArrayBuffer) return;

        compressBtn.disabled = true;
        compressBtn.textContent = 'Compressing...';
        hideAlert();

        try {
          const level = compressionLevel.value;
          const { PDFDocument } = PDFLib;

          // Calibrated scale and JPEG quality targets
          let scale = 1.5;   // High resolution to keep text crisp
          let quality = 0.8; // Modest image compression

          if (level === 'low') {
            // Light Compression: High DPI, subtle image quality drop
            // Target: ~25-35% size reduction (e.g., 1300 KB -> ~850-900 KB)
            scale = 1.5;
            quality = 0.82;
          } else if (level === 'medium') {
            // Standard Compression: Medium DPI, balanced quality
            // Target: ~50-60% size reduction (e.g., 1300 KB -> ~500-600 KB)
            scale = 1.2;
            quality = 0.68;
          } else if (level === 'high') {
            // Heavy Compression: Lower DPI, aggressive quality drop
            // Target: ~70%+ size reduction (e.g., 1300 KB -> ~200-300 KB)
            scale = 0.8;
            quality = 0.45;
          }

          const pdfDoc = await pdfjsLib.getDocument({ data: rawArrayBuffer.slice(0) }).promise;
          const newPdf = await PDFDocument.create();

          for (let i = 1; i <= pdfDoc.numPages; i++) {
            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: scale });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            const imgDataUrl = canvas.toDataURL('image/jpeg', quality);
            const imgBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());
            
            const embeddedImg = await newPdf.embedJpg(imgBytes);
            const newPage = newPdf.addPage([viewport.width / scale, viewport.height / scale]);
            
            newPage.drawImage(embeddedImg, {
              x: 0,
              y: 0,
              width: viewport.width / scale,
              height: viewport.height / scale,
            });
          }

          const pdfBytes = await newPdf.save({ useObjectStreams: true });
          const blob = new Blob([pdfBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = url;
          a.download = `compressed_${selectedFile.name}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          setTimeout(() => URL.revokeObjectURL(url), 5000);

        } catch (err) {
          console.error(err);
          showAlert('Failed to compress file. The document may be protected or corrupted.');
        } finally {
          compressBtn.disabled = false;
          compressBtn.textContent = 'Compress File';
        }
      });
    });
  </script>
</body>
</html>

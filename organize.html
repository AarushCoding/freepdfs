  <style>
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --border: #e2e2e2;
      --text: #0f0f0f;
      --muted: #666666;
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation */
    .top-bar {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: var(--primary);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }

    nav {
      display: flex;
      gap: 4px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    nav a:hover {
      color: var(--primary);
      background: var(--surface);
    }

    nav a.active {
      color: var(--primary);
      background: rgba(220, 38, 38, 0.06);
    }

    /* Hero Section */
    .hero {
      border-bottom: 1px solid var(--border);
      padding: 48px 24px;
      background: var(--surface);
    }

    .hero-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .hero-desc {
      color: var(--muted);
      font-size: 15px;
      max-width: 580px;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* Dropzone */
    .dropzone {
      border: 1px dashed var(--border);
      background: var(--bg);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: var(--surface);
    }

    .dropzone-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .dropzone-sub {
      font-size: 13px;
      color: var(--muted);
    }

    /* Alert Banner */
    .alert {
      padding: 12px 16px;
      border: 1px solid var(--border);
      font-size: 13px;
      margin-bottom: 24px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(220, 38, 38, 0.04);
    }

    /* Workspace */
    .workspace {
      display: none;
      margin-top: 32px;
    }

    .workspace.active {
      display: block;
    }

    .workspace-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: var(--primary);
    }

    /* Grid Layout for Big Thumbnails */
    .pages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .page-card {
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: grab;
      transition: all 0.15s ease;
    }

    .page-card:hover {
      border-color: #111111;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .page-card:active {
      cursor: grabbing;
    }

    .thumbnail-box {
      width: 100%;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .thumbnail-box canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    .page-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-number {
      font-size: 12px;
      font-family: monospace;
      color: var(--muted);
      font-weight: 600;
    }

    .page-actions {
      display: flex;
      gap: 8px;
    }

    .card-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .card-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .card-btn.delete-btn:hover {
      background: var(--primary);
      color: #ffffff;
    }

    /* Sortable Ghost State */
    .sortable-ghost {
      opacity: 0.3;
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .action-tip {
      font-size: 12px;
      color: var(--muted);
    }

    .btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      background: var(--bg);
    }

    .footer-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="nav-container">

      </a>
      <nav>

  <section class="hero">
    <div class="hero-container">
      
      <h1>Organize & Delete Pages</h1>
      <p class="hero-desc">Reorder, rotate individual pages, or delete pages.</p>
    </div>
  </section>

  <main>
    <div id="alert" class="alert"></div>

    <div id="dropzone" class="dropzone">
      <input type="file" id="file-input" accept="application/pdf,.pdf" style="display: none;" />
      <div class="dropzone-title">Select or drop a PDF file</div>
      <div class="dropzone-sub">Upload a document to visually manage pages</div>
    </div>

    <div id="workspace" class="workspace">
      <div class="workspace-header">
        <span id="page-count-label" class="section-label">0 Pages Loaded</span>
        <button id="clear-btn" class="clear-btn">Clear</button>
      </div>

      <div id="pages-grid" class="pages-grid"></div>

      <div class="actions-bar">
        <span class="action-tip">Drag thumbnails to reorder pages</span>
        <button id="save-btn" class="btn">Export PDF</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <p>&copy; freepdfs.tools</p>
      <p>
        <a href="privacy.html" style="color: var(--muted); margin-right: 12px;">Privacy Policy</a>
        <a href="terms.html" style="color: var(--muted);">Terms of Service</a>
      </p>
    </div>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.addEventListener('DOMContentLoaded', () => {
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file-input');
      const workspace = document.getElementById('workspace');
      const pagesGrid = document.getElementById('pages-grid');
      const pageCountLabel = document.getElementById('page-count-label');
      const clearBtn = document.getElementById('clear-btn');
      const saveBtn = document.getElementById('save-btn');
      const alert = document.getElementById('alert');

      let pagesData = []; // [{ originalIndex, rotation }]
      let rawArrayBuffer = null;
      let pdfFileName = 'organized.pdf';
      let sortable = null;

      dropzone.addEventListener('click', () => fileInput.click());
      clearBtn.addEventListener('click', reset);

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFile(e.target.files[0]);
        }
        fileInput.value = '';
      });

      ['dragenter', 'dragover'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(name => {
        dropzone.addEventListener(name, (e) => {
          e.preventDefault();
          dropzone.classList.remove('dragover');
        });
      });

      dropzone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      async function handleFile(file) {
        hideAlert();
        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
          showAlert('Please select a valid PDF file.');
          return;
        }

        try {
          pdfFileName = file.name;
          rawArrayBuffer = await file.arrayBuffer();

          const pdfDoc = await pdfjsLib.getDocument({ data: rawArrayBuffer.slice(0) }).promise;
          const numPages = pdfDoc.numPages;

          pagesData = [];
          pagesGrid.innerHTML = '';

          dropzone.style.display = 'none';
          workspace.classList.add('active');
          pageCountLabel.textContent = `${numPages} Pages Loaded`;

          for (let i = 1; i <= numPages; i++) {
            const pageObj = {
              id: 'page-' + Math.random().toString(36).substr(2, 9),
              originalIndex: i - 1, // 0-indexed for pdf-lib
              rotation: 0
            };
            pagesData.push(pageObj);

            const card = document.createElement('div');
            card.className = 'page-card';
            card.dataset.id = pageObj.id;

            card.innerHTML = `
              <div class="thumbnail-box">
                <canvas id="canvas-${pageObj.id}"></canvas>
              </div>
              <div class="page-meta">
                <span class="page-number">Page ${i}</span>
                <div class="page-actions">
                  <button class="card-btn rotate-btn" title="Rotate 90 degrees">Rotate</button>
                  <button class="card-btn delete-btn" title="Delete page">&times;</button>
                </div>
              </div>
            `;

            pagesGrid.appendChild(card);

            // Render high-DPI thumbnail onto canvas
            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 0.8 });
            const canvas = card.querySelector('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            // Rotate Handler
            card.querySelector('.rotate-btn').addEventListener('click', (e) => {
              e.stopPropagation();
              pageObj.rotation = (pageObj.rotation + 90) % 360;
              canvas.style.transform = `rotate(${pageObj.rotation}deg)`;
            });

            // Delete Handler
            card.querySelector('.delete-btn').addEventListener('click', (e) => {
              e.stopPropagation();
              pagesData = pagesData.filter(p => p.id !== pageObj.id);
              card.remove();
              updatePageNumbers();
            });
          }

          initSortable();

        } catch (err) {
          console.error(err);
          showAlert('Failed to process PDF. File may be encrypted or corrupted.');
        }
      }

      function initSortable() {
        if (sortable) sortable.destroy();
        sortable = new Sortable(pagesGrid, {
          animation: 150,
          ghostClass: 'sortable-ghost',
          onEnd: () => {
            const currentIds = Array.from(pagesGrid.children).map(c => c.dataset.id);
            pagesData.sort((a, b) => currentIds.indexOf(a.id) - currentIds.indexOf(b.id));
            updatePageNumbers();
          }
        });
      }

      function updatePageNumbers() {
        const cards = Array.from(pagesGrid.children);
        cards.forEach((card, idx) => {
          card.querySelector('.page-number').textContent = `Page ${idx + 1}`;
        });
        pageCountLabel.textContent = `${pagesData.length} Pages Remaining`;
      }

      function reset() {
        pagesData = [];
        rawArrayBuffer = null;
        pagesGrid.innerHTML = '';
        workspace.classList.remove('active');
        dropzone.style.display = 'block';
        hideAlert();
      }

      function showAlert(msg) {
        alert.textContent = msg;
        alert.className = 'alert error show';
      }

      function hideAlert() {
        alert.className = 'alert';
      }

      saveBtn.addEventListener('click', async () => {
        if (pagesData.length === 0) {
          showAlert('At least one page must remain to export a document.');
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Processing...';
        hideAlert();

        try {
          const { PDFDocument, degrees } = PDFLib;
          const srcPdf = await PDFDocument.load(rawArrayBuffer);
          const outPdf = await PDFDocument.create();

          for (const item of pagesData) {
            const [copiedPage] = await outPdf.copyPages(srcPdf, [item.originalIndex]);
            if (item.rotation !== 0) {
              const currentAngle = copiedPage.getRotation().angle;
              copiedPage.setRotation(degrees((currentAngle + item.rotation) % 360));
            }
            outPdf.addPage(copiedPage);
          }

          const pdfBytes = await outPdf.save();
          const blob = new Blob([pdfBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = url;
          a.download = `organized_${pdfFileName}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          setTimeout(() => URL.revokeObjectURL(url), 5000);

        } catch (err) {
          console.error(err);
          showAlert('Failed to export PDF file.');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Export PDF';
        }
      });
    });
  </script>
</body>
